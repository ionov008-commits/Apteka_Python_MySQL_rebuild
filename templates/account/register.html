{% extends "shared/_layout.html" %}
{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-4 bg-white">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary fw-bold">Регистрация в системе</h3>
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post" action="/account/register">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Логин</label>
                            <input type="text" name="username" class="form-control" required placeholder="ivan_ivanov">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" name="email" class="form-control" required placeholder="ivan@mail.ru">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Пароль</label>
                            <input type="password" name="password" class="form-control" required placeholder="********">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Роль пользователя</label>
                            <select name="role" id="roleSelect" class="form-select fw-bold text-primary" onchange="toggleRoleFields()">
                                <option value="customer">Покупатель</option>
                                <option value="owner">Владелец / Руководитель аптеки</option>
                                <option value="pharmacist">Фармацевт</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">ФИО</label>
                            <input type="text" name="full_name" class="form-control" required placeholder="Иванов Иван Иванович">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Телефон</label>
                            <input type="text" name="phone" id="phoneInput" class="form-control" placeholder="+375 (29) 000-00-00" required>
                        </div>

                        <div class="col-md-6" id="customerAddressBlock">
                            <label class="form-label fw-bold">Адрес проживания</label>
                            <input type="text" name="address" id="addressInput" class="form-control" placeholder="г. Минск, ул. ...">
                        </div>

                        <div class="col-12 d-none p-3 border rounded bg-light" id="ownerPharmacyBlock">
                            <h5 class="text-primary mb-3">Данные регистрируемой аптеки</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Название аптеки</label>
                                    <input type="text" name="pharmacy_name" class="form-control" placeholder="ООО 'Аптека Здоровье'">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Телефон аптеки</label>
                                    <input type="text" name="pharmacy_phone" class="form-control" placeholder="+375 (17) 200-00-00">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Часы работы</label>
                                    <input type="text" name="pharmacy_working_hours" class="form-control" placeholder="08:00-22:00 ежедневно" value="08:00-22:00 ежедневно">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Адрес аптеки</label>
                                    <input type="text" name="pharmacy_address" id="pharmacyAddressInput" class="form-control" placeholder="г. Минск, пр. Независимости, 10">
                                </div>
                            </div>
                        </div>

                        <div class="col-12 d-none p-3 border rounded bg-light" id="pharmacistBlock">
                            <label class="form-label fw-bold text-primary">Выберите аптеку для работы</label>
                            <select name="pharmacy_id" class="form-select">
                                {% for p in pharmacies %}
                                <option value="{{ p.pharmacy_id }}">{{ p.name }} ({{ p.address }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12 mt-3" id="mapSection">
                            <label class="form-label fw-bold">Укажите местоположение на карте</label>
                            <div id="map" style="height: 250px;" class="rounded border"></div>
                            <input type="hidden" name="latitude" id="latInput" value="53.90">
                            <input type="hidden" name="longitude" id="lonInput" value="27.56">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mt-4 fs-5">Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleRoleFields() {
    var role = document.getElementById("roleSelect").value;
    var customerAddressBlock = document.getElementById("customerAddressBlock");
    var ownerPharmacyBlock = document.getElementById("ownerPharmacyBlock");
    var pharmacistBlock = document.getElementById("pharmacistBlock");
    var mapSection = document.getElementById("mapSection");

    if (role === "pharmacist") {
        customerAddressBlock.classList.add("d-none");
        ownerPharmacyBlock.classList.add("d-none");
        pharmacistBlock.classList.remove("d-none");
        mapSection.classList.add("d-none");
    } else if (role === "owner") {
        customerAddressBlock.classList.add("d-none");
        ownerPharmacyBlock.classList.remove("d-none");
        pharmacistBlock.classList.add("d-none");
        mapSection.classList.remove("d-none");
    } else {
        customerAddressBlock.classList.remove("d-none");
        ownerPharmacyBlock.classList.add("d-none");
        pharmacistBlock.classList.add("d-none");
        mapSection.classList.remove("d-none");
    }
    if (map) setTimeout(() => map.invalidateSize(), 200);
}

document.getElementById('phoneInput')?.addEventListener('input', function (e) {
    let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,2})(\d{0,3})(\d{0,2})(\d{0,2})/);
    if (!x) return;
    e.target.value = !x[2] ? x[1] : '+375 (' + x[2] + ') ' + x[3] + (x[4] ? '-' + x[4] : '') + (x[5] ? '-' + x[5] : '');
});

let map, marker;
function initRegisterMap() {
    const latInput = document.getElementById('latInput');
    const lonInput = document.getElementById('lonInput');
    const defaultLat = 53.90;
    const defaultLon = 27.56;

    map = L.map('map').setView([defaultLat, defaultLon], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([defaultLat, defaultLon], { draggable: true }).addTo(map);

    marker.on('dragend', function() {
        const pos = marker.getLatLng();
        latInput.value = pos.lat.toFixed(6);
        lonInput.value = pos.lng.toFixed(6);
        reverseGeocode(pos.lat, pos.lng);
    });
}

async function reverseGeocode(lat, lng) {
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
        const data = await res.json();
        if (data.display_name) {
            const role = document.getElementById("roleSelect").value;
            if (role === 'owner') {
                document.getElementById('pharmacyAddressInput').value = data.display_name;
            } else {
                document.getElementById('addressInput').value = data.display_name;
            }
        }
    } catch (e) {}
}

document.addEventListener('DOMContentLoaded', initRegisterMap);
</script>
{% endblock %}
